[project]
name = "llmrl-aime25"
version = "0.1.0"
description = "GRPO vs PPO vs DPPO comparison on AIME 2025."
requires-python = ">=3.11"
dependencies = [
  "accelerate>=1.6.0",
  "datasets>=3.5.0",
  "huggingface_hub>=0.32.0",
  "pandas>=2.2.3",
  "plotly>=6.0.1",
  "rich>=14.0.0",
  "tensorboard>=2.19.0",
  "torch>=2.4.0",
  "transformers>=4.57.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["llmrl"]
